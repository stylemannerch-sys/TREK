# Fork only: builds this fork's image (upstream TREK plus the commits on the
# `custom` branch) whenever upstream publishes a release.
#
# 1. Finds the latest upstream release (or the tag given by hand).
# 2. Puts this fork's own commits on top of it. A conflict stops here.
# 3. Runs the tests of what the fork adds. A failure stops here.
# 4. Builds and pushes ghcr.io/<owner>/trek:<version>-focus and moves :focus.
#
# The `custom` branch itself stays on the release it was last rebased on by
# hand; each run puts the same commits on the newest release afresh.
#
# Nothing deploys from here: the server moves to a new image only when its
# owner changes the tag. A stopped run leaves every earlier image as it was,
# and GitHub mails the repository owner about the failed run.
name: Custom image

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build on (empty: latest release)'
        required: false
      force:
        description: 'Build even if this tag was built before'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0

      - name: Find the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          git remote add upstream https://github.com/liketrek/TREK.git
          git fetch --quiet --force upstream --tags
          tag="${ASKED:-$(gh api repos/liketrek/TREK/releases/latest --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/trek"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          if [ "$FORCE" != "true" ] && docker manifest inspect "$image:${tag#v}-focus" >/dev/null 2>&1; then
            echo "Already built on $tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Put this fork's commits on the release
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'custom-image'
          git config user.email 'custom-image@users.noreply.github.com'
          if ! git rebase "$TAG"; then
            git rebase --abort
            echo "::error::Our commits no longer apply cleanly on $TAG. The server keeps running its current image. Rebase the custom branch by hand."
            exit 1
          fi

      - uses: actions/setup-node@v6
        if: steps.release.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Test what the fork adds
        if: steps.release.outputs.skip != 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build --workspace=shared
          npm run i18n:parity:strict --workspace=shared
          cd client
          npx tsc --noEmit -p tsconfig.json
          npx vitest run src/pages/tripPlanner/focus src/pages/TripPlannerPage src/pages/tripPlanner/PanelTab

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.skip != 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}-focus
            ${{ steps.release.outputs.image }}:focus

